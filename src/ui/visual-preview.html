<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Komorebi UI visual preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #263e39;
      }

      .preview-world {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, rgb(27 46 41 / 12%), rgb(20 35 31 / 34%)),
          url("/assets/komorebi-title-plate-morning-clean.png") center / cover;
        filter: saturate(0.8) brightness(0.86);
      }

      .preview-world::after {
        position: absolute;
        inset: 0;
        content: "";
        background: radial-gradient(circle at center, transparent 35%, rgb(18 29 27 / 30%));
      }
    </style>
  </head>
  <body>
    <div class="preview-world" aria-hidden="true"></div>
    <div id="ui-preview"></div>
    <script type="module" src="./visual-preview.ts"></script>
  </body>
</html>
